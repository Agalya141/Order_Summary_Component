<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Order Summary Component</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
    </head>
    <body>
        <main class="card">
            <div class="card_image">
                <img src="illustration-hero.svg" alt="Person listening to music illustration" class="image">
            </div>
            <div class="card_body">
            <h1 class="card_title">Order Summary</h1>
            <p class="card_description">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
            <div class="card_plan">
                <div class="card_plan_details">
                    <div class="card_plan_info">
                    <img src="icon-music.svg" alt="Music Icon">
                    <div class="card_plan_text">
                        <div class="plan">Annual Plan</div>
                        <div class="price">$59.99/year</div>
                        </div>
                    </div>
                    <button type="button" class="change_link">Change</a>
                </div>
                <button class="proceed_button" type="button">Proceed to Payment</button>
                <button class="cancel_button" type="button">Cancel Order</button>
            </div>
            </div>
        </main>
       <footer class="attribution">
         Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
         Coded by <a href="#">Agalya</a>.
       </footer>
    </body>
</html>
